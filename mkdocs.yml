site_name: Mazduino Documentation
site_url: https://wiki.mazduino.com
nav:
  - Unduhan: downloads.md
  - Panduan Cepat: index.md
  # Grouped by product line rather than one flat list of families: Mazduino
  # ships more than ECUs now, and an accessories group slots in beside these
  # two when there is something to put in it.
  - ECU:
      - Mazduino LITE:
          - v0.1: mazduino-lite-v0.1.md
          - v0.2: mazduino-lite-v0.2.md
      - Compact 4 Channel:
          - v1: mazduino-compact-4ch-v1.md
          - v2.1: mazduino-compact-4ch-v2.1.md
          - v2.2: mazduino-compact-4ch-v2.2.md
          - v2.3: mazduino-compact-4ch-v2.3.md
          - v2.5: mazduino-compact-4ch-v2.5.md
      - Mini 6 Channel:
          - v1.0-v1.2: mazduino-mini-6ch-v1.0-v1.2.md
          - v1.3: mazduino-mini-6ch-v1.3.md
          - v1.3B: mazduino-mini-6ch-v1.3b.md
          - v1.3C: mazduino-mini-6ch-v1.3c.md
          - v1.4: mazduino-mini-6ch-v1.4.md
      - Mazduino Core:
          - rev0: mazduino-core-rev0.md
          - rev1: mazduino-core-rev1.md
      - Mazduino X600:
          - X600 (4.3"): mazduino-x600.md
  - Dash Display:
      - Mazduino Racedash:
          - 3.5" & 4": mazduino-racedash.md
          - Pro / M4, M5, M7 (4.3", 5" & 7"): mazduino-racedash-pro.md
  - Sensor dan Wiring: 
    - Persiapan: persiapan-sensor-wiring.md
    - Rekomendasi Ukuran Kabel: rekomendasi-ukuran-kabel.md
  - Manual TunerStudio:
    - Manual Lengkap: tunerstudio-manual.md
    - Instalasi: tunerstudio-instalasi.md
    - Konfigurasi Project: tunerstudio-konfigurasi.md
    - Interface Pengguna: tunerstudio-interface.md
    - Base Engine Settings: tunerstudio-base-engine.md
    - Limits & Protection: tunerstudio-limits-protection.md
    - Fuel System: tunerstudio-fuel-system.md
    - Ignition System: tunerstudio-ignition.md
    - Sensor Configuration: tunerstudio-sensors.md
    - CAN Bus Configuration: tunerstudio-canbus.md
    - Controller & Diagnostics: tunerstudio-controller.md
    - Troubleshooting: tunerstudio-troubleshooting.md
    - Examples & Map Switching: tunerstudio-examples.md
  - Custom Firmware:
    - Overview: firmware/index.md
    - CAN Input:
      - CAN Sensor Input: firmware/can-sensor-input.md
      - CAN Analog Input: firmware/can-analog-input.md
      - CAN Virtual Input (Digital): firmware/can-virtual-input.md
    - CAN Output: firmware/can-output.md
    - Math Channels: firmware/math-channels.md
    - User Tables: firmware/user-tables.md
    - Logic Outputs: firmware/logic-outputs.md
    - Spark Cut & Fuel Cut: firmware/fuel-spark-cut.md
    - Konsumsi Bahan Bakar: firmware/fuel-consumption.md
  - Tentang: about.md
theme:
  name: readthedocs
  custom_dir: theme_overrides
plugins:
  - search
  - git-revision-date-localized:
      type: date
      locale: id
      fallback_to_build_date: true
extra_javascript:
  - js/external-links.js
  - js/print-details.js
extra_css:
  - css/print.css
markdown_extensions:
  - attr_list
  # Lets Markdown inside <details markdown="1"> still be parsed, which is what
  # makes the collapsible legacy sections work. Built into Python-Markdown, so
  # it adds no dependency -- pymdownx.details would have.
  - md_in_html
  - toc:
      permalink: true